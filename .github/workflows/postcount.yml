name: Подсчёт игровых постов

on:
  schedule:
    - cron: '17 * * * *'   # раз в час, в :17
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Пробный запуск (ничего не записывать)'
        type: boolean
        default: true
      max_requests:
        description: 'Лимит запросов за запуск'
        default: '400'
      check_uids:
        description: 'id игроков для сверки, через запятую'
        default: ''

permissions:
  contents: write

concurrency:
  group: postcount
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Взять прошлое состояние из ветки data
        run: |
          mkdir -p data
          if git fetch -q origin data 2>/dev/null; then
            git show FETCH_HEAD:state.json > data/state.json || rm -f data/state.json
          fi

      - name: Подсчёт
        env:
          FORUM_URL: ${{ vars.FORUM_URL }}
          FORUM_LOGIN: ${{ secrets.FORUM_LOGIN }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
          DATA_DIR: data
          MAX_REQUESTS: ${{ inputs.max_requests || '400' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          CHECK_UIDS: ${{ inputs.check_uids }}
        run: node updater/update.mjs

      # Ветка data перезаписывается целиком, история не растёт.
      # Сохраняем результат и при ошибке посреди подсчёта, чтобы не терять сделанное.
      - name: Опубликовать
        if: always() && !inputs.dry_run && hashFiles('data/postcount.json') != ''
        run: |
          cd data
          git init -q -b data
          git config user.name "postcount-bot"
          git config user.email "postcount-bot@users.noreply.github.com"
          git add state.json postcount.json
          git commit -qm "update $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
